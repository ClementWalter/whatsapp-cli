# Claude Desktop extension: a v* tag publishes whatsapp-cli.mcpb on its GitHub release.
name: extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  extension:
    permissions:
      contents: write
    uses: ClementWalter/mcp-bridge/.github/workflows/extension.yml@4cb0b069643720cd9125eabc5427c0d534a06920
    with:
      launcher: bin/wa
      bridge-ref: 4cb0b069643720cd9125eabc5427c0d534a06920
