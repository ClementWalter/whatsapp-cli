[project]
name = "whatsapp-cli"
version = "0.1.0"
description = "Native WhatsApp and Signal CLIs for personal chats via linked-device pairing."
requires-python = ">=3.11"
# Exact-pinned to defend against supply-chain attacks: a compromised
# new release on PyPI can't sneak in via `>=` resolution. `uv.lock`
# holds matching hashes for the install side. Upgrade by bumping a
# pin here and re-running `uv lock`.
dependencies = [
    "aiohttp==3.13.5",
    "click==8.3.3",
    "cryptography==48.0.0",
    "protobuf==7.34.1",
    "qrcode[pil]==8.2",
    "signal-protocol==0.2.2",
]

[project.optional-dependencies]
# macOS-only — the import-contacts subcommand reads Contacts.app via PyObjC.
macos = ["pyobjc-framework-Contacts==12.1"]

[project.scripts]
wa = "wa.cli:cli"
signal-cli = "wa.signal_cli:cli"

[dependency-groups]
test = [
    "pytest==9.0.3",
    "aiohttp==3.13.5",
    "cryptography==48.0.0",
    "protobuf==7.34.1",
    "signal-protocol==0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
wa = ["signal_native/*.mjs", "signal_native/*.json", "signal_native/*.md", "signal_native/*.crt", "signal_native/protos/*.proto", "signal_native/protos/LICENSE"]

[tool.setuptools.packages.find]
include = ["wa*"]
exclude = ["wa.signal_native.node_modules*", "wa.signal_native.test*"]
